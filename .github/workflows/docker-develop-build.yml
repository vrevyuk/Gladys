name: Build & push develop Docker image

# On every push to vitalii/develop, build the all-in-one Gladys image
# (front + server, from Dockerfile.local) for linux/amd64 and push it to the
# GitHub Container Registry. Auth uses the built-in GITHUB_TOKEN, so no extra
# secrets are required.

on:
  push:
    branches:
      - vitalii/develop
  workflow_dispatch:

# A newer push to the branch supersedes an in-flight build.
concurrency:
  group: docker-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and push (amd64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/vrevyuk/gladys (metadata-action lowercases the repo name)
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Gladys Assistant (develop)

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.local
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
